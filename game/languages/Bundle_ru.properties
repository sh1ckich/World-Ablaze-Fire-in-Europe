reun_comitrecon_news = Второе пришествие атома
reun_comitrecon_news_info = Столичный Комитет Реконструкции (СКР) сегодня подтвердил свое фактическое управление над большей частью бывшей территории России. После нескольких лет ожесточенных конфликтов с бандами, сепаратистами и другими группировками, СКР объявил об установлении порядка и централизованной власти. Но за этим объявлением скрывается нечто большее, чем просто стремление к контролю. В своем обращении представитель СКР, чей голос транслировался по немногочисленным сохранившимся радиоканалам, заявил, что "эпоха хаоса и беззакония окончена". Он подчеркнул, что СКР – это не просто временная администрация, а сила, движимая жаждой мести тем, кто развязал ядерную войну и уничтожил Россию. "Мы помним каждый удар, каждое разрушение, каждую потерю", – заявил он, – "И мы не успокоимся, пока не отомстим сполна". Из его слов становится ясно, что СКР считает Европу и Соединенные Штаты главными виновниками катастрофы, и что их уничтожение – это одна из главных целей объединенной России под их управлением. "Мы восстановим нашу страну, а затем мы обрушимся на тех, кто принес нам горе и разрушение", – прозвучало в его речи, – "Готовьтесь к возмездию, западные варвары". Из подконтрольных СКР городов поступают сообщения о повсеместных патрулях и усиленном контроле. Люди в защитных костюмах ОЗК и противогазах, с различным бронированием, теперь являются обычным явлением на улицах. Их внешний вид, одновременно утилитарный и зловещий, создает атмосферу постоянного напряжения. Эти отряды, очевидно, пользуются полной поддержкой СКР и не стесняются применять силу для поддержания порядка, а также для мобилизации и тренировки населения к будущим войнам. Также сообщается, что СКР ведет активную пропагандистскую кампанию, направленную на укрепление своей власти и подогрев ненависти к "западным врагам". В ход идут старые лозунги о патриотизме и величии России, но с явным акцентом на дисциплину, повиновение и неприятие любого инакомыслия. Любые проявления неподчинения подавляются жестко и бескомпромиссно. Известно, что СКР уделяет большое внимание восстановлению военной мощи и промышленности, что указывает на их стремление не только к внутреннему укреплению, но и к будущим конфликтам с внешними противниками. Кажется, что главной целью СКР является не только восстановление России, но и создание мощной, агрессивной силы, готовой на любые меры для полного уничтожения своих врагов. Мир, переживший ядерную катастрофу, теперь наблюдает за тем, как в центре руин формируется новая, пугающая структура власти, движимая жаждой мести. Никто не знает наверняка, каковы истинные масштабы планов СКР и к чему приведет их стремление к возмездию. Однако, очевидно, что будущее становится все более непредсказуемым и тревожным, и новая война на горизонте:
