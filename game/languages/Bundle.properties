reun_comitrecon_news = The Second Coming of the Atom
reun_comitrecon_news_info = The Capital Reconstruction Committee (CRC) today confirmed its effective control over most of the former territory of Russia. After years of fierce conflicts with gangs, separatists, and other factions, the CRC announced the establishment of order and centralized authority. But behind this announcement lies something more than a mere desire for control. In an address, a CRC representative, whose voice was broadcast on the few remaining radio channels, stated that "the era of chaos and lawlessness is over." He stressed that the CRC is not just a temporary administration, but a force driven by a thirst for revenge against those who unleashed the nuclear war and destroyed Russia. "We remember every blow, every destruction, every loss," he declared, "And we will not rest until we have avenged ourselves fully." His words make it clear that the CRC considers Europe and the United States the main culprits of the catastrophe, and that their destruction is one of the main goals of the unified Russia under their control. "We will rebuild our country, and then we will fall upon those who brought us grief and destruction," his speech continued, "Prepare for retribution, Western barbarians." Reports from CRC-controlled cities indicate widespread patrols and increased surveillance. People in OZK protective suits and gas masks, with varying levels of armor, are now a common sight on the streets. Their appearance, simultaneously utilitarian and ominous, creates an atmosphere of constant tension. These squads evidently enjoy the full support of the CRC and do not hesitate to use force to maintain order, as well as to mobilize and train the population for future wars. It is also reported that the CRC is conducting an active propaganda campaign aimed at strengthening its power and fueling hatred towards "Western enemies." Old slogans about patriotism and the greatness of Russia are being used, but with a clear emphasis on discipline, obedience, and rejection of any dissent. Any manifestations of disobedience are suppressed harshly and uncompromisingly. It is known that the CRC is paying great attention to restoring military might and industry, indicating their desire not only for internal strengthening but also for future conflicts with external adversaries. It seems that the main goal of the CRC is not only the restoration of Russia but also the creation of a powerful, aggressive force ready to take any measures for the complete annihilation of its enemies. The world, having survived a nuclear catastrophe, now watches as a new, frightening power structure, driven by a thirst for revenge, is formed in the center of the ruins. No one knows for sure what the true scale of the CRC's plans is and what their pursuit of retribution will lead to. However, it is obvious that the future is becoming increasingly unpredictable and alarming, and a new war is on the horizon.
reun_comitrecon_news_title = Only a Matter of Time
reun_comitrecon = Reunification of Russia
reun_comitrecon_info = If you were hit – forget, if you were wounded – forgive, if you were betrayed – remember, remember everything at once and kill the offender —Tatiana Ustymenko
reun_comitrecon_title = Atonement for our enemies

hello_world_ablaze = Welcome to World Ablaze!
hello_world_ablaze_info = 2014. The political crisis in Ukraine, which led to a series of pro-Russian protests in southeastern Ukraine, which then escalated into hostilities in the Donetsk and Luhansk regions, and the annexation of Crimea by Russia, drew the boundaries of the old world, marking the beginning of the construction of a multipolar world. Almost immediately after the Euromaidan events, the leadership of the Russian Federation decided to conduct a special operation in 2014, the goals of which were to protect the interests of the Russian-speaking population, overthrow the Kyiv neo-Nazi junta, prevent the European integration of Ukraine, and return it to the Russian fold. Subsequent events developed rapidly: the Russian army crosses the territory of Crimea and the LPR/DPR, and then, without encountering much resistance, occupies the Southeast. In the Black Sea, an American destroyer that attempted to enter the waters of the Crimean peninsula was sunk. In addition to the southern direction, the offensive was conducted from the north, from the territory of Belarus. In a week, most of Ukraine was taken by the joint forces of the Russian Armed Forces, the LPR/DPR militia, volunteer formations, and individual units of the Belarusian army. An occupation puppet government is formed on the territory of Ukraine: by referendum, the Malorossiyan Autonomous Republic is proclaimed, which becomes a new subject of the Russian Federation, the head of the subject was appointed Sergey Vladimirovich Lyovochkin, a Ukrainian opposition politician and head of the Administration of President Viktor Yanukovych. During the fighting, a collaborationist unit was formed from captured Ukrainian Armed Forces fighters – the Malorossiyan Liberation Army, which was mainly engaged in anti-partisan activities. NATO enters the conflict and announces the introduction of troops into Ukraine, Polish units try to repel the CSTO in Galicia. After the news of the entry of European countries into the conflict, general mobilization is carried out in Russia. Meanwhile, Hungary and Romania refused to enter the war, and they decided to withdraw from NATO and the EU, and Turkey and Croatia also did not take part in the conflict. Two weeks after the start of the conflict, the Armed Forces of the Russian Federation and the Armed Forces of Belarus, having broken through the Polish front, reach the Vistula, however, the offensive stops there. From the north of Belarus, as well as from the Pskov region, allied forces launched an offensive on the Baltic states. Latvia, Lithuania, and Estonia were completely occupied. Soon, the advance in the Warsaw area is completely stopped by the arrival of NATO corps. US Navy ships destroy the Russian fleet in the Pacific Ocean and, taking advantage of the lack of infrastructure and the remoteness of the Russian army, land in Chukotka, moving inland. Petropavlovsk, Yuzhno-Sakhalinsk, Vladivostok, and Anadyr were occupied. The Russian fleet also suffered a defeat in the Black Sea, French, Italian, and American paratroopers landed in Sevastopol and Novorossiysk, but in the end, the landing was defeated. A turning point in the war is reached: due to heavy losses and the lack of success as such, realizing the gravity of its current situation, the command of the Russian Armed Forces decides to strike NATO bases and troop concentrations with munitions with depleted uranium. Later, tactical nuclear weapons begin to be used, and Russian soldiers also use cluster munitions to inflict maximum damage on the enemy. The NATO army resorts to similar measures: the American army launches tactical nuclear strikes on Russian military bases, command centers, and peaceful cities are also bombed. In the end, the Russian automatic control system for a massive retaliatory nuclear strike "Perimeter" is triggered, and thus a nuclear war began. During the exchange of nuclear strikes, billions of people, tens of thousands of plants and animals died. Irreversible changes also affected the landscape: the appearance of the terrain in many places affected by the consequences of nuclear strikes has changed greatly. For example, the Caspian Sea has dried up significantly, the Netherlands has been swallowed by water, and many hydroelectric power plants in different countries have been destroyed.
