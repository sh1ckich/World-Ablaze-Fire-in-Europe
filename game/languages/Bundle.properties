mlrs_levochkin_deadth_0 = A shot that will destroy everything.
mlrs_levochkin_deadth_1 = Today at 1:47 p.m., when Sergei Vladimirovich Lyovochkin, head of the Malorossiya Autonomous Republic, arrived at the Government House in Kiev at 12/2 Grushevskogo St., a Ukrainian neo-Nazi fired a shot from a homemade pistol while in the crowd. Lyovochkin was seriously wounded and died on the spot. The militant was quickly disarmed and arrested by police. It is not known what the death of such an important person will lead to, but instability is already beginning to reverberate in the society...
mlrsld2 = Memento Mori

mlrs_cw_0 = The Beginning of the End
mlrs_cw_1 = Almost immediately after Lyovochkin's murder the country plunged into chaos. Alexei Arestovich, Lyovochkin's closest associate and deputy, took power in Malorossiya. Part of the country was engulfed by a reactionary uprising of Russian neo-Nazis led by Alexei Milchakov. From the northwestern regions come alarming news: according to eyewitnesses and local police, power there has been seized by the totalitarian destructive sect “White Brotherhood”. Only one question remains: “Will the Kiev regime succeed in restoring order?”
