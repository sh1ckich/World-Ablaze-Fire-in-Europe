reunmgn0 = The triumph of the working class.
reunmgn = After almost a quarter of a century, Russia, plunged into anarchy by World War III and internal conflicts, is united again. Magnitogorsk, a major industrial center that threw off the shackles of capitalism, overthrew the usurper of the proletariat - the capitalist, carried the flame of revolution through the Russian anarchy, taking away the bread of the bourgeoisie, feeding it to the worker, uplifting the destitute. The reborn Russia represents the triumph of the proletariat over capital, the classless society marks the ideals of the French Commune, the NEP and humanism. 
