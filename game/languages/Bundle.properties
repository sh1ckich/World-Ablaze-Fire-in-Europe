0_description = Centrism is an ideology that seeks to\r\noccupy a middle ground between extremes,\r\nrejecting both blind radicalism and fro-\r\nzen conservatism. It favors a balanced\r\napproach in which compromise becomes a\r\ntool of social governance rather than a\r\nweakness. Centrists want a mixed economy\r\nthat combines market mechanisms with\r\nmoderate government intervention. Their\r\nworldview is based on the belief that\r\nstability and gradual change are prefe-\r\nrable to sudden leaps, and that diversity\r\nof opinion strengthens rather than dest-\r\nroys society. Critics, on the other hand,\r\nargue that such an attitude often lacks\r\na firm foundation and becomes an unprin-\r\ncipled following of the majority, while\r\nthe desire to please everyone leads to\r\nthe loss of a clear identity and the\r\ninability to resolve deep conflicts.

1_description = Neoconservatism is an ideology that emer-\r\nged in the 20th century and combines con-\r\nservative values with an active foreign\r\npolicy and a belief in the spread of de-\r\nmocracy. Neoconservatives favor a strong\r\ngovernment capable of protecting national\r\ninterests and promoting liberal ideals\r\nabroad, often through military interven-\r\ntion. They support free markets, but\r\nallow for government intervention to en-\r\nsure stability. The ideology rejects\r\nisolationism, believing that peace and\r\nsecurity require global leadership, es-\r\npecially from the U.S. Neoconservatives\r\noften criticize multiculturalism and\r\nemphasize values such as morality. Their\r\napproach combines pragmatism with idea-\r\nlism, which is controversial: supporters\r\nsee it as strength, while opponents see\r\nit as aggressive and utopian.

2_description = Agrarianism is an ideology that places\r\nrural life, farming and peasantry at the\r\ncentre of society. Agrarians believe that\r\nagriculture not only provides economic\r\nstability but also shapes moral values:\r\nindustriousness, simplicity, connected-\r\nness. They oppose industrialisation and\r\nurbanisation, which they see as a threat\r\nto traditional ways of life and the envi-\r\nronment. Agrarianism is often associated\r\nwith the idea of community self-suffici-\r\nency, decentralisation of power and the\r\nprotection of farmers' rights. The ideo-\r\nlogy emphasises the importance of land as\r\na source of wealth and freedom, while\r\nrejecting over-dependence on technology\r\nand global markets.\r\n     Critics of agrarianism point to its\r\nromanticization of the past and its im-\r\npracticality in the modern world, while\r\nproponents see it as a path to sustaina-\r\nbility and harmony.

3_description = Traditionalism is an ideology based on\r\nhonouring the past, tradition and empti-\r\nness as a source of wisdom and stability.\r\nTraditionalists believe that modernity,\r\nwith its progress, individualism and se-\r\ncularisation, is destroying time-honoured\r\nvalues: family, religion and community.\r\nThey advocate the preservation of hierar-\r\nchies, authority and cultural heritage,\r\noften idealising pre-industrial society.\r\nTraditionalism rejects liberal ideas of\r\nequality and change for its own sake,\r\nseeing them as a threat to order. Philo-\r\nsophers such as René Guénon and Julius\r\nEvola associated it with metaphysical\r\nprinciples and spirituality. Critics ac-\r\ncuse traditionalism of being retrograde\r\nand unable to adapt, while supporters\r\nsee it as a defence against the chaos\r\nof modernity.

4_description = Left-wing nationalism is an ideology that\r\ncombines nationalist ideas with leftist\r\nprinciples such as social justice and economic\r\nequality. Unlike right-wing nationalism, which\r\nemphasizes traditions and exclusivity,\r\nleft-wing nationalism focuses on protecting\r\nthe interests of the people from external oppression —\r\nimperialism, capitalism, or globalization.\r\nIt advocates for national sovereignty\r\nthrough the lens of egalitarianism, supporting\r\nthe working person and common goods, not\r\nthe elites. Often left-wing nationalism is associated\r\nwith anti-colonial movements and socialist\r\nideas, as in the case of some Latin American or\r\nAfrican leaders.\r\n Critics see in it a contradiction between\r\nthe universalism of the left and the particularism\r\nof nationalism, while supporters see it as a path to\r\nindependence and justice.

5_description = Monarchism is an ideology that supports\r\nmonarchy as a form of government where\r\npower is concentrated in the hands of a hereditary\r\nruler — a king, tsar, or emperor. Monarchists\r\nbelieve that monarchy provides stability,\r\ncontinuity, and unity of the nation, embodying\r\nits historical traditions and values.\r\nThey see the monarch as a symbol of the nation,\r\nstanding above political strife and partisan\r\ninterests. Monarchism is often associated with\r\nideas of order, hierarchy, and divine\r\nright of the ruler, especially in absolute\r\nforms. In constitutional monarchies,\r\nthe emphasis shifts to the symbolic role\r\nof the monarch with democratic governance.\r\n Critics consider monarchism outdated and\r\nundemocratic, while supporters value its ability\r\nto unite society and preserve cultural identity.

6_description = Conservatism is an ideology that values\r\nstability, traditions, and gradual\r\nchanges instead of radical reforms.\r\nConservatives believe that society should\r\nrely on time-tested institutions — family, religion,\r\nstate — which provide order and\r\nmorality. They are skeptical of\r\nutopias and abstract theories, preferring\r\npragmatism and preservation of the existing.\r\nEconomically, conservatism may\r\nsupport free markets, but with an emphasis\r\non protecting national interests.\r\nSocially, it often advocates for preserving\r\ncultural identity and against\r\nrapid modernization. Thinkers like\r\nEdmund Burke emphasized the importance of evolutionary\r\ndevelopment.\r\n Critics see conservatism as resistance\r\nto progress, while supporters see it as\r\nprotection against chaos and loss of values.

7_description = Liberal-conservatism is an ideology\r\nthat combines liberal and conservative\r\nprinciples, striving for a balance between freedom\r\nand traditions. It supports individual rights,\r\nmarket economy, and limited government — features of\r\nliberalism — but also values stability,\r\nmoral foundations, and cultural\r\nheritage characteristic of conservatism.\r\nLiberal-conservatives advocate for gradual\r\nreforms, avoiding radicalism, and\r\nbelieve that freedom should be accompanied\r\nby responsibility and respect for\r\norder. This ideology is often associated\r\nwith moderate political parties,\r\nsuch as the British Tories of the 19th century.\r\n Critics accuse it of inconsistency\r\nor compromise, while supporters see it as\r\na reasonable synthesis allowing adaptation to modernity\r\nwithout losing roots.

8_description = Theocracy is an ideology and form of\r\ngovernment in which power belongs to\r\nreligious leaders, and state laws are based\r\non sacred texts or divine commandments.\r\nTheocrats believe that society should live according\r\nto God's will, interpreted by the clergy, and\r\nsecular authority is subordinate to religious.\r\nThis system rejects the separation of church\r\nand state, seeing religion as the source of\r\nmorality and order. Examples include historical\r\npapal states or modern Iran with its Islamic republic.\r\nTheocracy emphasizes spiritual unity but often\r\nlimits personal freedoms and pluralism,\r\nrequiring submission to dogmas.\r\n Critics consider it repressive and\r\noutdated, while supporters see it as\r\na path to righteous living and protection from\r\nsecular decline

12_description = Ultramilitarism is a ferocious creed that\r\nexalts war as the ultimate expression of\r\nstrength and purpose. It fuses unbridled\r\naggression with a worship of military\r\nmight, viewing peace as weakness and\r\ncompromise as betrayal. Society bends to\r\nthe will of the army, where every citizen\r\nis a soldier, and dissent is crushed\r\nunder the boot of discipline. Ultramili-\r\ntarists crave conquest, seeing it as the\r\npath to glory and the purging of "infe-\r\nrior" foes. Resources fuel endless cam-\r\npaigns, while culture glorifies sacrifice\r\nfor the state. Driven by a thirst for\r\ndominance, they scorn diplomacy, embra-\r\ncing conflict as the forge of a supreme\r\nnation. Critics decry it as a barbaric\r\nspiral, where humanity drowns in blood\r\nand ruin, all for the fleeting thrill of\r\nvictory. Yet, its disciples revel in the\r\nchaos, hailing war as eternal.

13_description = Neo-Nazism is a venomous brew of resur-\r\nrected fascist fervor and unhinged racial\r\nsupremacy, idolizing a warped vision of\r\nAryan purity above all else. Driven by a\r\nrabid hatred of Jews, minorities, and\r\n"degenerates," it seeks to purge society\r\nof "inferior" elements through violence\r\nand intimidation. Neo-Nazis fetishize\r\nmilitarism and authoritarian control,\r\ndreaming of a totalitarian state where\r\ndissent is crushed and the "master race"\r\nreigns supreme. They cling to distorted\r\nhistory, glorifying the Third Reich while\r\npeddling conspiracy-laden propaganda to\r\nfuel their cause. The swastika becomes\r\ntheir unholy banner, and brute force\r\ntheir gospel. Critics decry it as a de-\r\nranged relic, thriving on paranoia and\r\ndivision, yet its followers revel in\r\nchaos, chasing a delusional utopia\r\nbuilt on blood and ruin.

14_description = Fascism is an authoritarian ideol-\r\nogy that emerged in the early 20th cen-\r\ntury, placing the state and nation above\r\nthe individual. Fascists, inspired by\r\nMussolini, proclaim the cult of a strong\r\nleader, national unity, and the suppres-\r\nsion of individualism for collective\r\nstrength. They reject liberalism, social-\r\nism, and democracy as weak and support\r\nmilitarism, nationalism, and total soci-\r\netal control. The economy is subordinated\r\nto the state, maintaining private proper-\r\nty but in the interest of the "common\r\ngood." Fascism romanticizes war as a\r\nmeans of strengthening the spirit and\r\nexpanding influence. Propaganda, censor-\r\nship, and a cult of discipline are its\r\nkey tools.\r\n      Critics call fascism repressive and\r\naggressive, while supporters see it as a\r\npath to order and national greatness in\r\ntimes of decline.  

15_description = Corporatocracy is an ideology and\r\nsystem where power is concentrated in the\r\nhands of large corporations, influencing\r\npolitics, the economy, and society more\r\nthan the state or citizens. It is not\r\nopenly declared but arises from the merg-\r\ning of business and elite interests,\r\nwhere profit and corporate control become\r\nthe main goals. Corporatocracy supports\r\nthe free market but in practice leads to\r\nmonopolies, weakened democracy, and soci-\r\nal inequality. The state often serves as\r\na tool to protect corporate interests\r\nthrough lobbying, tax benefits, or dere-\r\ngulation.\r\n     Critics see it as a threat to free-\r\ndom and mass exploitation, pointing to\r\nenvironmental damage and poverty. Suppor-\r\nters argue that it drives progress and\r\nefficiency, claiming that corporations\r\nmanage resources better than bureaucracy.  

16_description = Autocracy is an ideology and form\r\nof governance in which all power is con-\r\ncentrated in the hands of a single ruler\r\nor a small group, unrestricted by laws or\r\npopular will. It emphasizes absolute con-\r\ntrol, where decisions are made centrally,\r\nand opposition is suppressed. Autocracy\r\nvalues stability and order over freedom\r\nand pluralism, believing that strong rule\r\nis necessary to govern society and pro-\r\ntect it from chaos. The economy and\r\nsocial life are subject to the ruler’s\r\nwill, whether through state control or\r\nthe elite’s personal interests. The ide-\r\nology is often justified by tradition,\r\nreligion, or a national mission.\r\n     Critics see it as tyranny and oppres-\r\nsion, while supporters consider it effec-\r\ntive in crises and a way to avoid frag-\r\nmentation.  

17_description = Dictatorship is an ideology and\r\ngoverning system where power is concen-\r\ntrated in the hands of a single leader or\r\na small group that suppresses all forms\r\nof dissent. It rejects democratic princi-\r\nples, replacing them with strict control\r\nand coercion. A dictatorship seeks abso-\r\nlute societal submission, using propa-\r\nganda, fear, and repression to maintain\r\norder. The economy, culture, and politics\r\nare aligned with the ruling force’s goals,\r\noften disregarding citizens’ rights. The\r\nideology is justified by the need for\r\nunity, protection from external threats,\r\nor national restoration.\r\n     Critics see dictatorship as oppres-\r\nsive and inhumane, pointing to the loss\r\nof freedoms and corruption. Supporters\r\nview it as a way to swiftly resolve prob-\r\nlems and ensure stability during crises\r\nor societal weakness.  

19_description = Despotism is an ideology and form\r\nof governance where a single ruler or\r\ngroup wields power arbitrarily, without\r\nregard for laws or the people's will. It\r\nis characterized by absolute submission\r\nof society to the ruler, whose will is\r\nthe sole source of decisions. Despotism\r\nsuppresses freedoms, using fear, violence,\r\nand bribery to maintain control. The\r\neconomy and resources often serve the\r\nenrichment of the elite rather than\r\nsociety’s welfare. The ideology may be\r\nrooted in tradition, religion, or the\r\nmyth of a strong hand ensuring order. Its\r\ndistinction from other authoritarian sys-\r\ntems lies in the lack of even formal\r\nlimits on power.\r\n     Critics see despotism as tyranny and\r\ninjustice, while supporters consider it a\r\nway to prevent anarchy and maintain unity\r\nduring difficult times.  

20_description = Military junta is an ideology and\r\ngovernance system where power is seized\r\nand held by a group of military leaders,\r\nusually through a coup. It prioritizes\r\nmilitary discipline and force over civil-\r\nian institutions, viewing the army as the\r\nprimary guarantor of order and security.\r\nA junta suppresses political opposition,\r\nrestricts freedoms, and uses repression\r\nto control society. The economy is often\r\nsubordinated to military needs, while\r\nnational rhetoric justifies actions as\r\ndefense against internal or external\r\nthreats. The ideology rejects democracy,\r\nseeing it as weakness, and relies on\r\nhierarchy and loyalty within the army.\r\n     Critics call the junta brutal and\r\nanti-people, pointing to corruption and\r\nviolence. Supporters see it as a tempo-\r\nrary measure to stabilize chaos or crisis.  

21_description = Vanguard anarchism attempts to com-\r\nbine a decentralized anarchist society\r\nwith a standard, disciplined military\r\nforce for protection, often led by a cen-\r\ntral, dominant leader who has the final\r\nsay in matters of societal survival.\r\nSupporters argue that it is essential to\r\nprevent communes from being overpowered\r\nby more organized and stable external\r\nthreats. On the other hand, opponents\r\nbelieve it is a fundamentally flawed\r\ninterpretation of anarchism, as the\r\nneeds and will of the people are often\r\nsubordinated to the army’s authority for\r\ndefense, and the vast personal power\r\nheld by military leaders makes them\r\nlittle better than dictators.  

22_description = Statism is an ideology asserting\r\nthe supremacy of the state over all\r\naspects of society. It regards the state\r\nas the highest authority, responsible for\r\nregulating the economy, culture, educa-\r\ntion, and even personal freedoms for the\r\nsake of the common good or national\r\ngoals. Statists see strong centralized\r\ngovernment as a way to ensure order,\r\nsecurity, and progress, rejecting exces-\r\nsive individualism or market chaos.\r\nCitizens are viewed as part of a collec-\r\ntive body subordinated to state inter-\r\nests. The ideology can align with social-\r\nism or authoritarianism.\r\n     Critics accuse statism of suffocat-\r\ning freedoms and fostering bureaucracy,\r\nleading to inefficiency. Supporters see\r\nit as necessary to protect society from\r\ncollapse and external threats in unstable\r\ntimes.  

23_description = Stratocracy is an ideology and\r\nform of governance where the state is\r\nruled by the military, making the army\r\nthe foundation and driving force. It\r\nproclaims military discipline and power\r\nas the highest values, seeing them as\r\nguarantees of order and security. Author-\r\nity is concentrated in the hands of\r\nofficers or a military council, with\r\ncivilian institutions either subordinated\r\nor abolished. The economy and society\r\nare oriented toward military needs, with\r\ncitizens often engaged in militarized\r\nlife. Stratocracy rejects democracy as\r\nweak and prioritizes national duty over\r\nindividual freedoms.\r\n     Critics consider it oppressive and\r\ninhumane, pointing to rights suppression\r\nand militarization of culture. Supporters\r\nsee it as a way to ensure unity and\r\nprotection against threats.  

24_description = National communism is an ideology\r\nthat combines communist principles with\r\na nationalist spirit, emphasizing the\r\nnation’s independence and identity. It\r\nseeks a classless society but focuses on\r\nprotecting national interests from exter-\r\nnal influence, rejecting the universal-\r\nism of classical Marxism. The state plays\r\na key role in managing the economy,\r\ndirecting it for the people’s benefit\r\nrather than global forces. National com-\r\nmunists advocate collectivism but rooted\r\nin local traditions and culture, often\r\nopposing imperialism and capitalism.\r\nThe ideology demands strong authority\r\nto achieve its goals.\r\n     Critics see it as a departure from\r\ninternationalism and a tendency toward\r\nauthoritarianism, while supporters view\r\nit as a way to combine social justice\r\nwith national pride.  

25_description = Authoritarianism is an ideology\r\nthat asserts the need for strong central-\r\nized power to govern society and main-\r\ntain order. It rejects liberal freedoms\r\nand democratic pluralism, considering\r\nthem sources of chaos, and prioritizes\r\nstability over individual rights. Power\r\nis concentrated in the hands of a small\r\nelite or leader who controls politics,\r\neconomy, and culture through coercion\r\nand propaganda. Authoritarianism demands\r\ncitizens’ submission to state interests,\r\noften justifying this as protection from\r\nexternal threats or internal discord.\r\nOpposition is suppressed, and dissent is\r\ndeemed dangerous.\r\n     Critics accuse authoritarianism of\r\nrepression and curbing freedoms, seeing\r\nit as a path to tyranny. Supporters\r\nconsider it an effective means for rapid\r\ndevelopment and maintaining unity in\r\ntimes of crisis.  

26_description = Social nationalism is an ideology\r\nthat merges socialist ideals of equality\r\nwith nationalist loyalty to one’s nation.\r\nIt seeks to build a just society with\r\nstrong state control over the economy\r\nbut exclusively for "its own" people,\r\nrejecting outsiders. Social nationalists\r\nadvocate social protection, workers’\r\nrights, and nationalizing resources,\r\nwhile emphasizing the superiority of\r\nnational identity and culture. The ideol-\r\nogy often thrives on hatred of globalism\r\nand "foreign influence," demanding iso-\r\nlation or purification of society. It\r\ncombines collectivism with xenophobia,\r\npromising prosperity only for the chosen.\r\n     Critics see it as a dangerous hybrid\r\nleading to discrimination and aggression,\r\nwhile supporters view it as a way to\r\nprotect the people from exploitation and\r\npreserve their uniqueness.  

27_description = A semi-constitutional monarchy is\r\nan ideology and form of government where\r\nthe monarch retains significant power\r\nbut operates within a partially limited\r\nconstitution. It combines the monarch’s\r\ntraditional role as a national symbol and\r\nsource of authority with elements of\r\nrepresentative governance, such as a\r\nparliament. The monarch may influence\r\nlaws, appoint officials, or intervene in\r\npolitics, but their powers are formally\r\ndefined, though often broader than in\r\npurely symbolic monarchies. The ideology\r\nvalues stability and continuity, drawing\r\non historical heritage.\r\n     Critics see it as a compromise lead-\r\ning to conflicts between the monarch and\r\nthe people, as well as insufficient\r\ndemocracy. Supporters consider it a way\r\nto preserve traditions while adding\r\nflexibility for modern challenges.  

28_description = Democra-tatorship is an ideology and\r\nsystem that disguises authoritarian rule\r\nunder democratic forms. It maintains the\r\nexternal attributes of democracy—elections,\r\nparties, and a constitution—but in prac-\r\ntice, power is concentrated in the hands\r\nof a small group that manipulates the\r\nprocesses. Citizens' freedoms are limi-\r\nted, media are controlled, and the oppo-\r\nsition is weakened or suppressed through\r\nlaws and pressure. Democra-tatorship\r\nstrives for stability and control, avoid-\r\ning overt violence but using bureaucracy\r\nand propaganda for legitimacy. The ide-\r\nology justifies itself as necessary for\r\norder and protection from "enemies."\r\n     Critics see it as hypocrisy and an\r\nundermining of true democracy, pointing\r\nto the erosion of rights and the illusion\r\nof popular participation. Supporters\r\nconsider it a compromise allowing gover-\r\nnance while maintaining an illusion of\r\nfreedom in complex conditions.  

29_description = Solidarism is a commitment to the unity\r\nof society, where harmony between classes\r\nand groups is seen as an immutable truth\r\nthat transcends individual ambition. Pro-\r\nponents of solidarism seek the widespre-\r\nad adoption of this principle in all are-\r\nas of life, from economics to morality,\r\narguing that only through mutual aid and\r\nco-operation can true prosperity be achi-\r\neved. They want to see a cooperative eco-\r\nnomy based on collective responsibility.\r\nThe world view is based on a return to\r\nan idealised state where selfishness gi-\r\nves way to the common good and social\r\njustice becomes the ultimate goal. Oppo-\r\nnents, on the other hand, see it as a\r\nutopia that masks the suppression of\r\nfreedom in the name of unity and points\r\nto the danger of the dissolution of the\r\nindividual in an imposed 'community'.

30_description = Social democracy is an ideology that\r\nseeks to reconcile the ideals of equality\r\nand freedom by reforming society without\r\nrevolutionary upheaval. It favours a\r\nstrong state that regulates the economy\r\nand ensures social justice by protecting\r\nthe rights of workers and the vulnerable.\r\nSocial-Democrats want a regulated economy\r\nwhere the market serves society rather\r\nthan dictating its terms. Their view of\r\nthe world is based on a belief in pro-\r\ngress through class cooperation and the\r\ngradual improvement of life for all.\r\nOpponents, however, believe that the sys-\r\ntem relies too heavily on bureaucracy,\r\nstifles individual initiative and often\r\nsacrifices efficiency for populist measu-\r\nres. Critics also point out that the\r\npursuit of equality can turn into a le-\r\nvelling down that undermines individual\r\nachievement and ambition.

31_description = Social liberalism is an ideology that seeks to reconcile individual freedom with social justice, avoiding the extremes of individualism and collectivism. It advocates a market economy with active state involvement to reduce inequality and provide basic education, health care and a decent standard of living. The worldview is based on a belief in progress through reform, where equality of opportunity is seen as the key to a prosperous society. Proponents argue that this approach protects the weak without stifling the initiative of the strong. Critics, however, see it as half-hearted: the state, they argue, becomes unwieldy and the freedom of the market is undermined by bureaucracy, which hinders development and creates dependency on social benefits rather than true equality.

32_description = Progressivism is a commitment to the continuous development and improvement of society, perceived as an unquestionable truth leading to the ultimate good of humanity. Proponents seek widespread reform in all areas of life, from politics to culture, arguing that a 'right' future requires a break with outdated traditions. They want a planned economy with strong state regulation. Their view of the world is based on a belief in progress as the ultimate goal, with science and social justice cleansing society of 'alien' vestiges of the past. Opponents see a blind obsession with novelty, the sacrifice of the present for utopias, and the replacement of popular freedom with the will of elites imposing their ideals under the guise of universal salvation.

33_description = Communism is an ideology that promises a classless society in which private property gives way to collective ownership and the work of each serves the good of all. It requires a planned economy run by the state to distribute resources equally. The worldview is based on a belief in the inevitable collapse of capitalism, which breeds oppression, and in re-revolution as the only way to liberate the masses. Proponents see it as the ultimate justice, where exploitation and inequality disappear and humanity achieves harmony. Opponents, however, argue that such ideas are utopian and in reality lead to totalitarianism, repression of freedom and economic stagnation, where elite power replaces the promise of equality and dreams of brotherhood are drowned in bureaucratic violence.

34_description = Transhumanism seeks to transcend the boundaries of human existence by combining biology with advanced technology to create a society that transcends the limits of body and mind. The movement is led by visionaries who are the final voice of the evolution of the species, armed with artificial intelligence, genetic engineering and cybernetics. Proponents argue that this is necessary for human survival in an age of cosmic challenges and ecological crises, promising eternal life and super-intelligence. Opponents see it as a perversion of the natural order: the will of the masses is subordinated to the techno-elite, and the limitless power of those who control the machines gives rise to new pirates. Instead of freedom, they argue, transhumanism threatens to turn humans into tools of their own ambitions, blurring the line between the living and the mechanical.

35_description = Stratocratic Communism is a commitment to the idea of equality, embodied by the iron-fisted power of a military elite seen as the unchanging guardian of absolute justice. It seeks to establish communist ideals in which the army is the core of society and discipline is the highest value. Its motive is to return to a 'proper' order where there is no room for bourgeois excesses and resources are distributed under the control of soldiers' councils. Supporters see this as the 'purity' of the revolution, a defence against capitalist elements that threaten the collective. Critics, on the other hand, believe that militarisation will stifle freedom, turn the people into instruments of the military leaders, and that the dream of equality will sink into a cult of power and subordination, far from true brotherhood.

36_description = Totalism is a ferocious doctrine in which the state becomes an all-consuming force that suppresses individual will for the sake of unity and power. There is no room for weakness: control pervades everything from the mind to the body, making order an absolute. Totalists long for a centralised economy where resources serve the greatness of the system, not the individual. They see the world as a battlefield where only the strongest survive, and where dissenting thought is burned out like a plague. They glorify the past, when the iron hand ruled ruthlessly, and despise the 'decay' of freedom. The army and propaganda are their weapons to build a monolith where everyone is a screw in the machine. Driven by the dream of eternal power, they brand their enemies as a threat to their cause, but critics see it as a tyranny where man dissolves into a faceless mass and life is a service to the idol of the state.

37_description = Oligarchy is an ideology that glorifies the power of the chosen, where the elite, with their wealth and influence, rule society and push the masses to the margins. It's not just a system, it's a philosophy of inequality, where the strong prosper and the weak serve. Some see order and stability, others see a rot of privilege and oppression. Oligarchy feeds on the control of resources and knowledge, creating the illusion of natural selection. It has its roots in the ancient polis, but it still flourishes today, disguised as democracy or the market. Critics cry out about injustice, about the gap between 'top' and 'bottom', about corruption as the fuel of the system. Supporters whisper about the need for a firm hand and the 'destructive creativity' of elites for progress. Oligarchy is not a monolith, but a mirror of human ambition, where power is both a goal and a curse. It is dangerous to generalise: it is as complex as human nature itself.

38_description = Democratic socialism is an ideology that dreams of equality through soft revolution, where people power and social justice go hand in hand. It is not the axe of the radical, but the scalpel of reform, which seeks to tame capitalism while preserving freedom. Its adherents believe in the state as the guardian of the common good: free health care, education and employment protection are its hallmarks. The roots go back to Marx, but without any harshness, blending with the liberal spirit. Critics complain of naivety, bureaucracy and the stranglehold of the market. Supporters, on the other hand, see 'destructive creativity' in breaking the old chains of inequality. This is not a monolithic path, but a mixed bag of ideas, from moderate Scandinavian models to fierce left-wing voices. Democratic socialism is the hope of some and the utopia of others, a balance between dream and reality. It is difficult to summarise: it lives in disputes and compromises.

39_description = Left-wing populism is an ideology that shouts about the people against the elites, waving the flag of justice. It's the voice of the oppressed, calling for a revolt against the fat cats and their pigs. Not a theorist in a tower, but the voice of the street, demanding power for the 'ordinary' - by redistributing wealth and breaking the system. It's emotional: there are no cold plans, just the fire of the struggle for equality. It's rooted in leftist dreams of brotherhood, but seasoned with anger and simplification. Critics hiss about demagoguery and the danger of tyranny masquerading as 'the will of the people', while fans praise the 'equal world' that is tearing down the barriers of privilege. Left-wing populism is not a pedestrian plan but a seething cauldron, from peaceful rallies to violent barricades. It is as diverse as the masses that spawned it, and dangerous in its sincerity. It's hard to generalise: it's a flame that both heats and burns.

40_description = Syndicalism is an ideology that dreams of a world in which the workers, with clenched fists, hold the wheel of destiny. This is not the chaos of anarchy, but a construction in which the trade unions, the heart of power, replace the state and capital. Through strikes and solidarity, they break the chains of exploitation and build a society of equals. It has its roots in the crucible of 19th-century labour, where the sweat and blood of workers fed the dream of freedom. Supporters see it as 'destructive creativity' that sweeps away masters and bureaucrats in favour of direct popular control. But critics hiss: "Utopia will turn out to be a polemic of trade union leaders, no better than the old czars. Syndicalism is not a monolith, but a flame that smoulders in reforms and blazes in revolutions. It demands faith in the masses but fears the chaos of disintegration. It is an appeal to the elites and a hymn to self-government. It is an appeal to the elites and a hymn to self-government, where power is not a gift from above but a right won through struggle. Syndicalism is as diverse as labour itself.

41_description = Esoteric fascism is a sinister blend of occult mysticism and iron-fisted tyranny that elevates the nation to the status of a sacred cult. Extolling secret rituals and a 'higher destiny', its adherents seek to cleanse society of 'spiritual filth' by imposing blind devotion to the state as a divine plan. They glorify a mythical past steeped in esoteric symbols and despise the 'profane' as unworthy of their truth. The army and Thai religious orders become instruments of 'revivalism', and dissent is punished as heresy. Driven by a lust for power and 'cosmic justice', esoteric fascists dream of a greatness built on fearful submission. Their ideals are imbued with darkness and intolerance, where man is but a pawn in the hands of the 'chosen'. What they have in common is an insane longing for the 'eternal order' hidden in the shadows of their perverted doctrines.

42_description = Esoteric socialism is an unknown mixture of occult obsession and blind faith in collective equality, elevated to a mystical absolute. Seeking to fuse souls into a single 'cosmic harmony', its adherents preach the total surrender of individual freedom for the sake of an unseen 'higher purpose'. They glorify secret rituals and elite orders, believing them to be agents of 'true brotherhood', while trampling on the real needs of the people. The state becomes an al-\r\r\r\r\rptar, where the masses are sacrificed to dogma and power is concentrated in the hands of 'enlightened' priests. Driven by a thirst for 'spiritual purification', they despise the material world and impose asceticism and blind obedience. Their goal is 'eternal unity', but the price is the suppression of reason and individuality. Thus esoteric socialism becomes a dark utopia, where mysticism stifles freedom and equality drowns in the shadows of the elite.

43_description = Socialism is a commitment to a set of ideas and values aimed at achieving equality and social justice through collective ownership of the means of production. As an ideal of social organisation, socialism seeks to overcome class differences and exploitation, seeing them as historically conditioned vices. Socialist movements use these principles to reform or radically transform society, including the economy and politics. The underlying motive is to create a system in which resources are distributed according to need and power is vested in the people. Socialism can manifest itself in a variety of forms, from moderate to revolutionary, but what unites its movements is a belief in the need to defend their ideas against capitalist influences perceived as alien to true equality.

44_description = Market socialism is an ideology that combines elements of the market economy with principles of social justice, aiming to overcome capitalist contradictions without completely abandoning competition. There are different approaches: from co-operative models, where workers own enterprises, to mixed economies with state regulation. What unites them is the belief that market efficiency and equality can be reconciled. Critics point to the dangers of bureaucracy or the loss of socialist ideals under the pressure of market forces. Some approaches draw on the ideas of Proudhon or modern theories of decentralisation, rejecting centralised control. Market socialism is not a single doctrine, but a range of views from moderate reform to radical change. Generalisations must be made with caution because of the diversity of interpretation and practice.

45_description = Agrarian socialism is an ideology that seeks to create a just society through a radical rethinking of agrarian life as the basis for social and economic justice. Proponents advocate decentralisation, cooperative farming and a rejection of industrial capitalism, seeing the rural way of life as the path to sustainability and communalism. The various currents include both moderate reforms and revolutionary transformations, united by a belief in a 'return to the land' as a return to the natural order. Critics point to utopianism and the risks of economic stagnation. The ideology is based on the romanticism of peasant life and Rousseau's ideas of the 'natural man', and rejects urbanisation as a source of alienation. Agrarian socialism is not homogeneous: it combines peaceful and radical methods and requires a concrete approach.

46_description = Liberalism seeks to combine individual freedom and a market economy with a strong state that provides law and order to protect society. Its proponents argue that such a system is necessary for individual flourishing and the prevention of chaos, emphasising the role of laws and institutions as guarantors of equality of opportunity. The central figure is not the leader, but the idea of the rule of law, which is the final voice in the debate about freedom and justice. But critics argue that this is just a facade that reveals the power of the elites: the market breeds inequality and the state suppresses radical change in the name of stability. \They point out that despite its proclaimed freedom, liberalism often serves the interests of capital rather than the people, and its dependence on bureaucracy makes it not so different from authoritarian systems, where the will of the masses is subordinated to the system for its 'protection'.

47_description = National liberalism seeks to combine collective freedom and market mechanisms with a national identity protected by a strong state. Its proponents argue that this is necessary to preserve culture and sovereignty in the face of global threats, with the central idea of national greatness as the final voice in political and economic matters. Liberal values are subordinated to the interests of the nation, and the market is regulated for its benefit. Opponents see this as a distortion of personal liberalism: individual freedom is curtailed for the sake of unity, and the state, protecting 'its own', suppresses dissent and minorities. Critics see it as a cloak for the authoritarian power of elites, where nationalism becomes an instrument of control rather than liberation, and leaders who hide behind the 'will of the people' are little different from dictators.

48_description = Right-wing populism seeks to combine national identity and grassroots interests with a strong leader who protects 'his' people from elites and external threats. Proponents of this movement argue that it is necessary to return power to the masses, who are tired of corrupt structures and globalism, by representing the direct will of the people through a charismatic leader. Critics, however, argue that it is a distorted version of democracy: the interests of the 'people' are replaced by the will of the leader, and the struggle against 'enemies' - migrants or elites - leads to authoritarianism and the division of society. They point out that populism, based on the emotions of the masses rather than reason, often reinforces intolerance and undermines equality by making the leader not the servant of the people but their new master, cloaked in slogans of 'justice'.

49_description = Libertarianism seeks to combine maximum individual freedom and non-interference by the state with the market as the primary regulator of society. Proponents argue that this is necessary to protect human rights and prosperity, where everyone is responsible for themselves and coercion is minimised. The idea of absolute autonomy is the final argument in the debate about justice and power. But critics see it as utopian: the free market leads to inequality, and the absence of the state leaves the weak unprotected against the strong. They point out that by denying control, libertarianism places power in the hands of those who are already rich and powerful, creating not a free society but chaos, where the rights of the masses are subordinated to the interests of the few under the guise of 'natural order'.

50_description = Anarcho-capitalism attempts to combine full individual freedom and market mechanisms with the absence of the state, relying on private enterprise to protect rights and order. Proponents argue that there is no need to maximise the efficiency of voluntary cooperation, where the market regulates conflict without coercion. The key role is given to private leaders, whose will determines the rules of their estates. Critics, however, see this as a return to anarchism: freedom becomes the rule of the strongest, and the absence of government leads to chaos or the dictatorship of corporations. They point out that an unchecked market increases inequality, and the protection of rights becomes the privilege of the rich, so that panarcho-capitalism is merely a screen for the power of the elite, with the masses subordinated to money rather than ideas.

51_description = Social monarchism is a commitment to the idea of absolute monarchical power based on social justice and traditions that are perceived as immutable and true regardless of time. These principles are used by groups seeking to restore the 'right' order, where the monarch is the guarantor of the people's welfare and the defender of their historical identity. The fundamental motive of social monarchism is a return to the lost 'golden age' of harmony between power and society, as interpreted by its proponents. Social monarchist movements are those which advocate the 'purity' of traditions and their defence against liberal or revolutionary influences, which they regard as alien and destructive to the authentic way of life of the past.

52_description = Anarchism is an ideology that seeks to destroy all forms of coercion and hierarchy in order to create a society of free and equal individuals. It ranges from peaceful communes seeking cooperation to revolutionary groups using violence to overthrow the government. What they have in common is a belief in self-government and a rejection of the state as an instrument of oppression. Critics point to tendencies towards utopianism and chaos: without structures, anarchism can succumb to stronger systems. Some ideas draw on the philosophy of Kropot and Bakunin, which implies a rejection of authoritarianism in favour of natural solidarity. \Anarchism is not a single doctrine, but a multiplicity of views, from non-violent to extreme, which makes it difficult to grasp. Therefore, any conclusions about it require caution and consideration of its diversity.

53_description = Fundamentalism is the adherence to a set of ideas and values that are accepted as immutable and absolute, regardless of their content. These principles are used by social groups and movements that seek to spread throughout society, including politics. The underlying motive of fundamentalism is the desire to return to some original 'right' state, to restore the 'lost authenticity' of a culture or way of life as interpreted by that particular current. Fundamentalist movements are those of thought, religious or secular, which advocate the purity of their ideas and political plans and their 'defence' against the 'alien' elements that have arisen in the course of history.

54_description = Conservative socialism is an ideology that seeks to combine traditional values with socialist justice to create a stable order. Its various forms range from religious, communitarian to secular, emphasising the stability of the nation. They are united by a belief in the preservation of cultural principles and equality through state control. Critics point to the danger of stagnation: the attempt to freeze the past hinders progress. Some theories are based on the idea of the 'people's spirit', which implies a rejection of liberalism and cosmopolitanism for the sake of cohesion. Conservative socialism is not a single doctrine, but a set of views that include both peaceful reform and the harsh suppression of dissent. It is difficult to generalise: it balances between nostalgia and the desire for equality.

55_description = Clerofascism is a dark mixture of theocratic fervour and fascist tyranny, aimed at establishing a 'divine order' through strict control of society. It takes many forms, from religious absolutism to the cult of the leader as 'God of Heaven'. Its adherents seek to purge the world of 'heresy' and dissent by idealising the past and suppressing freedom. The army and the church are fused into instruments of power, and faith becomes the banner of oppression. Critics see chaos and hypocrisy: violence instead of spirituality, hierarchy for the chosen few instead of justice. Some theories link it to ideas of 'holy war', but it remains diverse, ranging from fanaticism to pragmatism. What unites them is a lust for control, disguised as 'the will of the gods', which makes Clerofascism a threat to reason and humanity.

56_description = Technocracy is an ideology that seeks to control society through scientific progress rather than political passion. Its forms range from utopias where technoscience serves equality to elitist utopias where power is concentrated in the hands of engineers and scientists. What unites them is a belief in rationality and efficiency as the path to a 'perfect' society. Critics see the threat in the abandonment of human values and the replacement of democracy with a technical dictatorship. Some theories draw on Enlightenment ideas, rejecting the chaos of tradition in favour of a 'managed future'. Technocracy is not a single doctrine, but a set of views ranging from mild reforms to radical experiments in society. It is difficult to generalise: it promises order, but risks leading to a cold inhumanity of governance.

57_description = Anarcho-communism is a commitment to the ideals of freedom and equality as absolute truths, regardless of conditions. Its principles are embodied by social groups that seek the total abolition of the state and private property in favour of collective governance. The main motive of anarcho-communism is to return to the natural state of society, where there are no hierarchies and no oppression, in an interpretation that sees capitalism as an alien element of history. Anarcho-communist optical currents of thought advocate the purity of their ideas, rejecting compromises with power and the market and defending them against any form of state or bourgeois influence. This search for authenticity makes them radical in the struggle for a classless, exploitation-free world.

58_description = Accelerationism is an ideology that aims to accelerate the historical process by destroying existing social and political structures in order to create a new, more just order. There are different forms of it: from the left, inspired by socialist or anarchist ideals, to the right, which seeks a new hierarchy. What unites them is a belief in radical transformation and 'destructive creativity'. Critics point to the dangers of chaos and violence. Some theories are based on Nietzsche's philosophy and the idea of the 'death of God', which implies a rejection of traditional values. Accelerationism is not a monolithic ideology, but a set of diverse and often contradictory views, including both non-violent and extremist methods. Any generalisations should therefore be made with caution.

59_description = Anarchy attempts to balance the freedom of the individual with the complete absence of authority in order to create an equal society. Its proponents say it's about eliminating oppression and hierarchies, where everyone decides for themselves through cooperation. There is no leader, and solutions are the product of the masses coming to an agreement to survive without oppression. Opponents of the system believe that it is a utopia doomed to chaos: without structure, the weak perish and the strong create a new tyranny under the guise of freedom. They see anarchy as a threat, where lack of control leads to disintegration and the struggle of all against all, and the ideals of equality are crushed by the pressure of human nature for power. In this way, freedom becomes a screen for new forms of oppression of the masses.

60_description = National Bolshevism combines fierce nationalism with the revolutionary longing for socialism, elevating the state to a cult. Its adherents vow to protect the soul of the 'people' from the alien forces of capital and liberals, and see iron discipline as the path to the nation. They believe that only a strong leader and a red fist can save the country from decay, fuelling hatred of 'enemies' - both external and internal. Critics call it a toxic cocktail: behind the mask of equality lies totalitarian oppression, while the flames of patriotism burn freedom. Opponents say that without such a fusion, the nation will fall under the heel of globalism. But the opponents see only a shadow of the old dictatorships: the people are just fuel for the militarist machine, and the leader is the new leader, ruling under the banner of 'justice'.

61_description = Christian democracy is a commitment to values based on the Christian faith and traditions, which are seen as unshakable and eternal. These principles are embraced by parties and groups who seek to incorporate them into politics and society. The main motive is a return to the moral order lost in the age of secularisation and liberalism through the defence of the family, faith and social justice in their understanding of the 'true way'. Christian democracies stand for the preservation of cultural identity and the purity of law, opposing what they see as alien trends such as atheism, cosmopolitanism and radical ideas. They seek a balance between individual freedom and duty to God and society, offering a model where faith and reason coexist in harmony.

