mlrs_cw_2_2 = (Play as Arestovich)
mlrs_cw_2_3 = (Play as White Brotherhood)

mlrs_w = Everything is in its place.
mlrs_w_info = The operation to restore constitutional order in the territory of the Malorossiyan AR was successfully conducted: the sectarians were crushed, the extremist militants were defeated. Many residents express hope that the new government headed by Alexey Arestovich will begin reforming the current political system, however, no official comment from the Head of the Republic has yet been made.
mlrs_w_f = Kyiv held!

mrus_w = Russian Triumph
mrus_w_info = Over Kyiv, the mother of Russian cities, the imperial banner with the Kolovrat proudly flutters in the wind. The last pockets of resistance from Arestovich's supporters have been suppressed, the cultists have been decisively defeated, and the leader of the "Rusichi," Alexey Milchakov, delivered a triumphant speech in the Verkhovna Rada building, during which he declared the "long-awaited restoration of Russian order on the ancestral Russian land."
mrus_w_f = Glory to Rus'!

xch_w = Transformation is coming
xch_w_info = The Great White Brotherhood of YUSMALOS has gained control over the entire territory of the former Malorossiyan AR. The faithful sons of Maria Devi Christos are already preparing for the "cleansing" of Ukraine from heretics: all sinners who dared to reject the commandments of the Mother of the World await inevitable earthly punishment for serving the Beast-Antichrist. The new government has officially banned passports, tax IDs, insurance certificates, medical records, and other documents, which, according to the followers of the cult, are marks of the beast 666.
xch_w_f = Glory to the Great Mother of the World!

